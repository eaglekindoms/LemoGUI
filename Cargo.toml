[package]
name = "LemoGUI"
version = "0.0.1"
authors = ["eaglekindoms <huyongmao35@outlook.com>"]
edition = "2021"
description = "GUI library dependent on wgpu"
license = "MIT"
keywords = ["graphics", "gui"]
repository = "https://github.com/eaglekindoms/LemoGUI"
resolver = "2"

[[example]]
name = "show_button"
path = "example/show_button.rs"

[[example]]
name = "show_shap"
path = "example/show_shape.rs"

[[example]]
name = "rich_editor"
path = "example/app/main.rs"

[[example]]
name = "test_graph_algo"
path = "example/proto/test_algo.rs"

[dependencies]
wgpu = "29.0.3"
async-trait = "0.1.89"
winit = "0.30"
futures = "0.3.32"
cgmath = "0.18"
log = "0.4.30"
simple_logger = "5.2.0"
rand = "0.9"
bytemuck = { version = "1.25", features = ["derive"] }
image = "0.25"
raw-window-handle = "0.6"
ab_glyph = "0.2.32"

[dependencies.sdl2]
version = "0.38"
features = ["raw-window-handle", "bundled"]
#optional = true

[features]
wgpu_impl = []
winit_impl = []
sdl2_impl = []
default = ["wgpu_impl", "sdl2_impl"]